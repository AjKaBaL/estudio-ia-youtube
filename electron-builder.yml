appId: br.estudio.iayoutube
productName: Estúdio IA YouTube
copyright: Copyright © 2026 AjKaBaL
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
# Fuses: desligam recursos do Electron que poderiam ser usados para executar código fora do app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Os dados do usuário ficam em %APPDATA%\estudio-ia-youtube e NÃO são apagados ao desinstalar.
